# Overrides the core client's default nginx config in the e2e stack
# (mounted over /etc/nginx/conf.d/default.conf by docker-compose.e2e.yml).
#
# In prod, Traefik routes the intro-course path prefixes; the e2e stack has no
# Traefik, so this config mirrors those rules:
#   /intro-course/api/*       ->  intro-course server, prefix KEPT (the Go server
#                                 groups its routes under intro-course/api/...)
#   /intro-course-developer/* ->  intro-course client nginx, prefix STRIPPED (the
#                                 MF remote is built with publicPath 'auto' and
#                                 served at /)
#
# Note the two prefixes differ: the published core client resolves the remote
# from /intro-course-developer/remoteEntry.js (baked in at build time by
# clients/core/rspack.config.mjs), while the phase API lives under
# /intro-course/api. nginx picks the longest matching prefix, so the api
# location wins for API calls. Everything else falls through to the SPA below.

server {

  listen 80;

  location /intro-course/api/ {
    proxy_pass http://server-intro-course:8080;
  }

  location /intro-course-developer/ {
    proxy_pass http://client-intro-course/;
  }

  # Core's own API on the browser origin. The core client itself calls core through
  # CORE_HOST, but the intro-course component reaches one core endpoint
  # (PUT /api/keycloak/:courseID/group, used by the tutor page) through its OWN
  # axios instance, whose baseURL is the browser origin. In prod Traefik routes
  # /api on the core host to server-core; mirror that here, or the request lands on
  # the SPA fallback and the Keycloak group can never be created.
  location /api/ {
    proxy_pass http://server-core:8080;
  }

  location / {
    gzip_static on;
    root   /usr/share/nginx/html;
    index  index.html index.htm;
    try_files $uri $uri/ /index.html;
  }

  error_page   500 502 503 504  /50x.html;

  location = /50x.html {
    root   /usr/share/nginx/html;
  }

}
