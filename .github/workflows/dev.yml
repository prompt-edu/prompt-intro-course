name: Build and Deploy to Dev

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  lint-server:
    uses: ./.github/workflows/lint-server.yml
    secrets: inherit

  vet-server:
    uses: ./.github/workflows/vet-server.yml
    secrets: inherit

  lint-client:
    uses: ./.github/workflows/lint-client.yml
    secrets: inherit

  test-server:
    needs: [lint-server, vet-server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
      - name: Pre-pull test container images
        shell: bash
        run: |
          set -euo pipefail

          for image in postgres:15 testcontainers/ryuk:0.13.0; do
            for attempt in 1 2 3; do
              if docker pull "$image"; then
                break
              fi

              if [[ "$attempt" == "3" ]]; then
                exit 1
              fi

              sleep "$((attempt * 10))"
            done
          done
      - name: Run server tests
        run: |
          cd server
          go test ./...

  # Browser-level tests against the real core shell hosting this repo's remote.
  # Gated on lint/vet so an obvious mistake fails in seconds rather than minutes,
  # and run in parallel with test-server. Deployment does not depend on it.
  test-e2e:
    needs: [lint-server, vet-server, lint-client]
    uses: ./.github/workflows/test-e2e.yml
    permissions:
      contents: read

  build:
    needs: [test-server, lint-client, vet-server]
    uses: ./.github/workflows/build-and-push.yml
    with:
      release_tag: ${{ github.sha }}
    secrets: inherit

  deploy-dev:
    needs: build
    uses: ./.github/workflows/deploy.yml
    with:
      environment: prompt-dev-vm
      server_image_tag: ${{ needs.build.outputs.server_image_tag }}
      client_image_tag: ${{ needs.build.outputs.client_image_tag }}
    secrets: inherit
