name: Check Apple Device Capacity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    environment: prompt-prod-vm
    steps:
      - name: Count registered iPhones without exposing device details
        env:
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
        run: |
          node --input-type=module <<'JS'
          import { createPrivateKey, sign } from 'node:crypto'
          import { appendFileSync } from 'node:fs'

          const { APPLE_ISSUER_ID: issuer, APPLE_KEY_ID: keyId, APPLE_PRIVATE_KEY: rawKey } = process.env
          if (!issuer || !keyId || !rawKey) throw new Error('Apple API credentials are missing')
          const encode = (value) => Buffer.from(JSON.stringify(value)).toString('base64url')
          const now = Math.floor(Date.now() / 1000)
          const unsigned = `${encode({ alg: 'ES256', kid: keyId, typ: 'JWT' })}.${encode({ iss: issuer, iat: now, exp: now + 600, aud: 'appstoreconnect-v1' })}`
          const key = createPrivateKey(rawKey.replace(/\\n/g, '\n'))
          const signature = sign('sha256', Buffer.from(unsigned), { key, dsaEncoding: 'ieee-p1363' }).toString('base64url')
          const token = `${unsigned}.${signature}`

          let url = 'https://api.appstoreconnect.apple.com/v1/devices?limit=200&fields%5Bdevices%5D=deviceClass%2Cstatus'
          let iphoneCount = 0
          let totalCount = 0
          while (url) {
            const response = await fetch(url, { headers: { Authorization: `Bearer ${token}` } })
            if (!response.ok) throw new Error(`Apple device inventory request failed with HTTP ${response.status}`)
            const page = await response.json()
            if (!Array.isArray(page.data)) throw new Error('Apple returned an unexpected device response')
            for (const device of page.data) {
              totalCount += 1
              if (device.attributes?.deviceClass === 'IPHONE') iphoneCount += 1
            }
            url = page.links?.next || ''
          }

          const remaining = Math.max(0, 100 - iphoneCount)
          const summary = `## Apple device capacity\n\nRegistered iPhones: **${iphoneCount} / 100**. Available iPhone slots before the membership-year reset: **${remaining}**. Disabled devices still count. Total registered devices across product families: ${totalCount}.\n\nThis read-only check does not invite users or register devices.\n`
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary)
          console.log(`Registered iPhones: ${iphoneCount}/100; available slots: ${remaining}`)
          JS
